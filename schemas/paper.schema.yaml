$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required: [schema_version, id, title, year, authors, topics, source, sources]
properties:
  schema_version:
    const: 4
  id:
    type: string
    description: Use the version-free arXiv ID or a stable source-prefixed slug.
    pattern: '^(arxiv-[0-9]{4}\.[0-9]{4,5}|(conference|blog|news|web)-[a-z0-9]+(-[a-z0-9]+)*)$'
  title:
    type: string
    pattern: '\S'
  year:
    type: integer
    minimum: 1991
  authors:
    type: array
    items:
      type: string
      pattern: '\S'
  topics:
    description: Curated topic tags. Write topics as an empty list until the wiki has enough reviewed papers to establish a taxonomy.
    type: array
    uniqueItems: true
    items:
      type: string
      pattern: '\S'
  source:
    type: object
    additionalProperties: false
    required: [url]
    properties:
      version:
        type: string
        pattern: '\S'
      url:
        type: string
        pattern: '^https?://[^\s]+$'
  sources:
    type: object
    minProperties: 1
    propertyNames:
      pattern: '^S[1-9][0-9]*$'
    additionalProperties:
      type: string
      pattern: '\S'
  relationships:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [paper, type, reason]
      properties:
        paper:
          $ref: '#/properties/id'
        type:
          enum: [extends, contrasts_with, uses, evaluates, related_to]
        reason:
          type: string
          pattern: '\S'
if:
  properties:
    id:
      pattern: '^arxiv-'
then:
  properties:
    authors:
      minItems: 1
    source:
      required: [version]
      properties:
        version:
          pattern: '^v[1-9][0-9]*$'
x-page:
  headings: [Overview, What, Terminology, Why, When, How, Worked Example, Differentiators, Evidence, Relationships, Technical Depth, Source Locators, FAQ]
  optional_headings: [Evidence, Technical Depth]
  allow_empty: [FAQ]
  why_guidance: >-
    Use three short, labeled blocks: why the problem matters, what named prior work
    did and what it missed, and what this paper does differently and why it addresses
    that gap. Cite the comparison; save finer details for Differentiators.
  when_guidance: >-
    Name who would use the contribution and for what realistic task. For a benchmark,
    explain what a score can verify in that scenario and what needs a separate check.
  terminology_columns: [Term, Meaning in this paper, Why it matters]
  example_types: [Paper example, Derived example, Illustrative example]
  article_not_applicable:
    Terminology: No specialized terminology.
    Worked Example: No method or procedure to demonstrate.
  faq_guidance: Start empty. Record reader questions as H3s with concise, sourced answers.
